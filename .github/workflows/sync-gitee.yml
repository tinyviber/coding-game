name: Sync to Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and tags to Gitee
        env:
          GITEE_DEPLOY_KEY: ${{ secrets.GITEE_DEPLOY_KEY }}
        run: |
          test -n "$GITEE_DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITEE_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H gitee.com >> "$HOME/.ssh/known_hosts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add gitee git@gitee.com:naiij/coding-game.git
          git push --force gitee HEAD:main
          git push --force gitee 'refs/tags/*:refs/tags/*'
